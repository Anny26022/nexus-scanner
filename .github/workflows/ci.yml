name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: "DO NOT DELETE EDL PIPELINE"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            cloudflare/scanner-worker/package-lock.json

      - name: Verify browser scanner
        working-directory: frontend
        run: npm ci && npm test && npm run build

      - name: Verify Cloudflare scanner
        working-directory: cloudflare/scanner-worker
        run: npm ci && npm test && npm run typecheck && npm run build

      - name: Verify scanner publication
        working-directory: .
        run: python -m unittest discover -s frontend -p 'test_*.py' -v
