name: Frontend CI

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'workers/r2-delivery/**'
      - 'workers/screener-ai/cors.ts'
      - 'DO NOT DELETE EDL PIPELINE/requirements.txt'
      - '.nvmrc'
      - '.github/workflows/frontend-ci.yml'
      - '.github/workflows/ci.yml'
      - 'tools/benchmark_r2_publication.py'
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'workers/r2-delivery/**'
      - 'workers/screener-ai/cors.ts'
      - 'DO NOT DELETE EDL PIPELINE/requirements.txt'
      - '.nvmrc'
      - '.github/workflows/frontend-ci.yml'
      - '.github/workflows/ci.yml'
      - 'tools/benchmark_r2_publication.py'
  workflow_dispatch:

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
      - name: Run frontend tests
        run: npm test
      - name: Test data Worker
        run: node --test ../workers/r2-delivery/test.mjs
      - name: Build frontend
        run: npm run build
      - name: Build and check the embeddable package
        run: npm run build:lib && npm run check:lib
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: frontend/requirements-ci.lock
      - name: Install Python dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r requirements-ci.lock
      - name: Run frontend Python regression tests
        # Exercise the real rclone transport test, including corruption checks.
        # This is the same uploader package used by daily/weekly publication.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone
          python -m unittest discover -s . -p 'test_*.py' -v
          python ../tools/benchmark_r2_publication.py --list-delay 0 --object-delay 0
