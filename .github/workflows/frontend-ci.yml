name: Frontend CI

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'DO NOT DELETE EDL PIPELINE/requirements.txt'
      - '.nvmrc'
      - '.github/workflows/frontend-ci.yml'
      - '.github/workflows/ci.yml'
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'DO NOT DELETE EDL PIPELINE/requirements.txt'
      - '.nvmrc'
      - '.github/workflows/frontend-ci.yml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: frontend/requirements-ci.lock
      - name: Install Python dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r requirements-ci.lock
      - name: Run frontend tests
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Run frontend Python regression tests
        run: python -m unittest discover -s . -p 'test_*.py' -v
