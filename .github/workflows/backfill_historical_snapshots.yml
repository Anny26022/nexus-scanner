name: Backfill Historical Snapshots

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start Date for backfill (YYYY-MM-DD)'
        required: true
        default: '2021-10-01'
      end_date:
        description: 'End Date for backfill (YYYY-MM-DD)'
        required: true
        default: '2021-10-15'
      upload_r2:
        description: 'Upload generated snapshots to Cloudflare R2'
        type: boolean
        required: true
        default: true

permissions:
  contents: write

concurrency:
  group: backfill-historical-snapshots
  cancel-in-progress: false

jobs:
  backfill:
    name: Generate Historical Snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'DO NOT DELETE EDL PIPELINE/requirements.txt'

      - name: Restore refresh history (Ledgers & Vectorized History)
        uses: ./.github/actions/restore-refresh-history

      - name: Cache Historical Downloads & Cache
        uses: actions/cache@v4
        with:
          path: DO NOT DELETE EDL PIPELINE/.scanner_cache
          key: historical-cache-${{ runner.os }}-${{ hashFiles('DO NOT DELETE EDL PIPELINE/ohlcv_data/*.csv') }}
          restore-keys: |
            historical-cache-${{ runner.os }}-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "DO NOT DELETE EDL PIPELINE/requirements.txt"
          pip install boto3 openpyxl

      - name: Rebuild and publish historical snapshots
        env:
          START_DATE: ${{ github.event.inputs.start_date }}
          END_DATE: ${{ github.event.inputs.end_date }}
          UPLOAD_R2: ${{ github.event.inputs.upload_r2 }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: nexus-screener-chart-data
        run: |
          args=(--start-date "$START_DATE" --end-date "$END_DATE"
                --pipeline-dir "DO NOT DELETE EDL PIPELINE"
                --output-dir "outputs/historical_snapshots"
                --sessions-manifest "frontend/public/data/sessions.json")
          if [[ "$UPLOAD_R2" == "true" ]]; then args+=(--upload-r2); fi
          python tools/backfill_historical_snapshots.py "${args[@]}"

      - name: Commit verified session pointers
        if: ${{ github.event.inputs.upload_r2 == 'true' }}
        env:
          START_DATE: ${{ github.event.inputs.start_date }}
          END_DATE: ${{ github.event.inputs.end_date }}
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add frontend/public/data/sessions.json "DO NOT DELETE EDL PIPELINE/rs_universe_history.json.gz"
          if ! git diff --staged --quiet; then
            git commit -m "chore(data): rebuild historical sessions [$START_DATE to $END_DATE]"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Upload Artifacts Archive
        uses: actions/upload-artifact@v4
        with:
          name: historical-snapshots-${{ github.event.inputs.start_date }}-to-${{ github.event.inputs.end_date }}
          path: |
            outputs/historical_snapshots/*.json.gz
            DO NOT DELETE EDL PIPELINE/rs_universe_history.json.gz
          if-no-files-found: ignore
