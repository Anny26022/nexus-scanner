name: Cache retention

on:
  workflow_run:
    workflows: [Daily Data Refresh, Weekly Adjusted OHLCV Refresh]
    types: [completed]
  schedule:
    - cron: '15 1 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview deletions without applying them
        type: boolean
        default: true

permissions:
  contents: read
  actions: write
  pull-requests: read

concurrency:
  # Serialize deletion with both refresh workflows, including manual dispatches.
  group: daily-data-refresh
  queue: max
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Never check out the triggering PR or workflow run's head with this token.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Prune obsolete cache snapshots
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          args=()
          if [ "$DRY_RUN" != "true" ]; then
            args+=(--delete)
          fi
          python3 tools/prune_actions_caches.py --repo "$REPOSITORY" "${args[@]}"
