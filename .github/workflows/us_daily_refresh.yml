name: US Daily Refresh

# The US scanner release (/data/us/current.json): each stock's history brought up to the closed session, India's
# engine on the result (DO NOT DELETE EDL PIPELINE/docs/US_MARKET.md). A run before the snapshot has caught up
# (a US holiday, or still trading) exits 75 inside the build and publishes nothing.
on:
  # Started on time by the nexus-gh-cron Worker in new_nexys_ultimate (workers/gh-cron/schedule.ts) at 07:00 India
  # time Tuesday-Saturday, after New York's after-hours session in both EST and EDT. GitHub's own schedule starts runs
  # hours late, and one that starts after the next New York open finds that session still trading.
  workflow_dispatch:

permissions:
  contents: read

# Its own queue: the US release never touches India's pointer, so it may run beside the India refresh.
concurrency:
  group: us-daily-refresh
  # queue: max keeps up to 100 waiting runs, not one: the default cancels an older waiting run when a newer one arrives,
  # and the nexus-gh-cron Worker never retries a scheduled run it finds cancelled.
  queue: max
  cancel-in-progress: false

jobs:
  refresh-us:
    runs-on: ubuntu-latest
    # A cold cache seeds every history (about 6,000 paced requests) and spends up to 20 minutes on stock pages
    # (the rest follow over the next runs); a warm run takes its bars from TradingView's scan in seconds (a missed run fills its gap from Yahoo).
    timeout-minutes: 90

    steps:
      # The runner context is not available to a job's env, so the root under the runner's temp folder is set here.
      - name: Locate the US root
        run: echo "US_ROOT=${{ runner.temp }}/us-root" >> "$GITHUB_ENV"

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'DO NOT DELETE EDL PIPELINE/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "DO NOT DELETE EDL PIPELINE/requirements.txt"

      - name: Verify US pipeline code
        run: |
          source "$GITHUB_WORKSPACE/tools/quiet_test_annotations.sh"
          cd "DO NOT DELETE EDL PIPELINE"
          PYTHONPATH=src:. python -m unittest tests.test_us_market tests.test_us_history tests.test_us_tradingview tests.test_us_statement_history tests.test_us_news tests.test_us_earnings tests.test_us_filings -v
          python -m unittest discover -s ../frontend -p 'test_publish_us.py' -v

      - name: Install R2 uploader
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rclone

      # Price history, stock pages, SEC filings and the ledgers are the state carried between runs, kept in private R2
      # as India's is (tools/us_state.py), not in the Actions cache India's caches share. A failed restore stops the run.
      - name: Pull US state from R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
          R2_BUCKET: nexus-screener-chart-data
        run: python tools/us_state.py pull

      # The US earnings calendar is refreshed here, with the US build, rather than by India's refresh: it then runs on
      # every US session (not NSE days) and after New York's results. Merged into the live index, which is pulled first
      # (a missing one stops this step rather than starting from empty); optional, as the build falls back to the
      # stored calendar and TradingView's dates.
      - name: Refresh the Earnings Pulse US calendar
        continue-on-error: true
        timeout-minutes: 15
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
          R2_BUCKET: nexus-screener-chart-data
        run: |
          python frontend/site_data.py pull-pointer results/us_index.json
          status=0
          python frontend/earningspulse_history.py --markets US || status=$?
          python frontend/site_data.py push-pointer results/us_index.json
          exit "$status"

      # Earnings Pulse's US archive, as the step above left it in R2, copied for the build's earnings dates.
      - name: Copy the Earnings Pulse US archive from R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
          R2_BUCKET: nexus-screener-chart-data
        run: python tools/us_state.py pulse

      - name: Build the US root
        id: build
        env:
          PYTHONUNBUFFERED: '1'
          # SEC asks automated clients for a contact address in the User-Agent (markets/us/filings.py). A secret, so the
          # address is not in this public repository; without it the run skips EDGAR.
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
        run: |
          cd "DO NOT DELETE EDL PIPELINE"
          set +e
          PYTHONPATH=src:. python -m edl_pipeline.markets.us "$US_ROOT"
          status=$?
          set -e
          if [ "$status" -eq 75 ]; then echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          exit "$status"

      # Pushed before publication too: a run that times out or is cancelled during the R2 upload ends before any later
      # step, and would otherwise lose every history this run fetched. A run whose build did not pass its release checks
      # (a rerun of the same session that passes them counts as good) pushes --unverified, so previous/ keeps the last
      # good state however many bad runs follow (tools/us_state.py).
      - name: Push US state to R2
        if: always() && steps.build.outcome != 'skipped'
        env:
          BUILD_GOOD: ${{ steps.build.outcome == 'success' && steps.build.outputs.ready == 'true' }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
          R2_BUCKET: nexus-screener-chart-data
        run: |
          if [ "$BUILD_GOOD" = "true" ]; then python tools/us_state.py push; else python tools/us_state.py push --unverified; fi

      - name: Fetch US ETF snapshot
        if: steps.build.outputs.ready == 'true'
        continue-on-error: true
        run: |
          PYTHONPATH="DO NOT DELETE EDL PIPELINE/src:DO NOT DELETE EDL PIPELINE" python "DO NOT DELETE EDL PIPELINE/fetch_etf_snapshot.py" --market us --output "$US_ROOT/etf_snapshot.json"

      - name: Publish the US release
        id: publish
        if: steps.build.outputs.ready == 'true'
        env:
          PYTHONUNBUFFERED: '1'
          EDL_US_BASE_DIR: ${{ env.US_ROOT }}
          EDL_CHART_STORAGE: r2
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
          R2_BUCKET: nexus-screener-chart-data
        run: python frontend/publish_us.py

      # The publish step advances the rotation ledger; only that file is pushed again, leaving previous/ as the first
      # push of this run set it.
      - name: Push the rotation ledger to R2
        if: always() && (steps.publish.outcome == 'success' || steps.publish.outcome == 'failure')
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
          R2_BUCKET: nexus-screener-chart-data
        run: python tools/us_state.py push --keep-previous rotation_membership_ledger.json.gz
