[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edl-pipeline"
version = "0.1.0"
description = "Python market-data ETL pipeline for Indian equities using public Dhan and NSE endpoints."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Aniket Mahato" }]
keywords = ["etl", "market-data", "nse", "dhan", "equities"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "beautifulsoup4>=4.12",
    "numpy>=1.24",
    "pandas>=2.0",
    "requests>=2.31",
    "pypdf>=6.1,<7",
]

[project.scripts]
edl-pipeline = "run_full_pipeline:cli"

[tool.setuptools]
package-dir = { "edl_pipeline" = "src/edl_pipeline" }
packages = [
    "edl_pipeline",
    "edl_pipeline.breadth",
    "edl_pipeline.scanner",
    "edl_pipeline.sources",
    "edl_pipeline.transforms",
]
py-modules = [
    "add_corporate_events",
    "advanced_metrics_processor",
    "announcement_artifacts",
    "apply_nse_daily_ohlcv",
    "build_chart_artifacts",
    "bulk_market_analyzer",
    "build_corporate_action_ledger",
    "build_filing_history_artifact",
    "build_ipo_screener_artifact",
    "build_quarterly_financial_ledger",
    "build_rs_ratings",
    "build_shareholding_history",
    "dhan_next_utils",
    "enrich_delivery_data",
