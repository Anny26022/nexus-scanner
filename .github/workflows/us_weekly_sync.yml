name: US Weekly Finviz Universe Sync

# Runs every Saturday morning (06:00 UTC) after the US market closes for the week.
# Re-crawls Finviz's classification of US stocks and commits it:
# - us_theme_catalog.json: Finviz's themes and the sub-themes in each;
# - us_thematic_universe.json: each themed stock's themes and sub-themes;
# - us_ownership_universe.json: every listed stock's Finviz sector, industry and type, with ownership and short interest.
# The Theme Tracker's US map (new_nexys_ultimate, refresh-us-theme-map.yml) is built from these files.
on:
  schedule:
    - cron: '0 6 * * 6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: us-weekly-sync
  cancel-in-progress: false

jobs:
  sync-finviz:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so the push step can rebase onto commits that land during the crawl

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'DO NOT DELETE EDL PIPELINE/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "DO NOT DELETE EDL PIPELINE/requirements.txt"

      - name: Crawl Finviz Thematic & Ownership Universes
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          cd "DO NOT DELETE EDL PIPELINE"
          PYTHONPATH=src:. python -m edl_pipeline.markets.us.finviz --crawl all --delay 0.1 --workers 3

      - name: Verify Finviz Crawler, US Pipeline and Publisher Tests
        run: |
          cd "DO NOT DELETE EDL PIPELINE"
          PYTHONPATH=src:. python -m unittest tests.test_us_finviz tests.test_us_market -v
          python -m unittest discover -s ../frontend -p 'test_publish_us.py' -v

      - name: Commit and Push Updated Universes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "DO NOT DELETE EDL PIPELINE/us_thematic_universe.json" "DO NOT DELETE EDL PIPELINE/us_ownership_universe.json" "DO NOT DELETE EDL PIPELINE/us_theme_catalog.json"
          if git diff --staged --quiet; then
            echo "No changes to Finviz universes."
          else
            git commit -m "chore(us): weekly Finviz thematic & ownership universe sync [skip ci]"
            # Other jobs push this branch too: rebase onto whatever landed during the crawl and retry.
            branch="${GITHUB_REF_NAME}"
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin "$branch" && git push origin "HEAD:$branch"; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              echo "Push attempt $attempt failed; retrying..."
              sleep $((attempt * 10))
            done
            echo "Could not push the Finviz universe sync after 5 attempts." >&2
            exit 1
          fi
