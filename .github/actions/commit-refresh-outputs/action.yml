name: Commit refresh outputs
description: Stage only the pipeline's reference files and preserve the caller commit message.
inputs:
  weekly:
    description: Include weekly Tijori and Dhan group artifacts.
    default: 'false'
  commit-message:
    description: Generated data commit message.
    required: true
runs:
  using: composite
  steps:
    - name: Commit and Push Results
      shell: bash
      env:
        WEEKLY_REFRESH: ${{ inputs.weekly }}
        REFRESH_COMMIT_MESSAGE: ${{ inputs.commit-message }}
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        # A refresh can run long enough for main to receive a merge.  Start
        # the generated-data commit from that latest tip rather than
        # rebasing binary artifacts after they have been committed.
        git fetch origin main
        # Mixed reset retains the generated working files while refreshing
        # the index too, so unrelated code merged during this run is kept.
        git reset --mixed origin/main
        # Carried-over pipeline files are stored in R2 (tools/pipeline_state.py), not committed:
        # every committed version stayed in Git history (~41 MiB per refresh).
        git add reference/index-constituent-mappings.json.gz
        git add reference/index-constituent-mappings.manifest.json
        # Published site data goes to R2 (frontend/site_data.py) and is served without a rebuild, so it is
        # not committed. The reference files stay in Git: the next run reads them (the Dhan sync refuses to
        # clear known members, the Tijori export resumes from its cache) and their history records changes.
        if [ "$WEEKLY_REFRESH" = "true" ]; then
          git add reference/tijori/tijori-overviews.json.gz reference/tijori/summary.json
          git add reference/dhan/group-stocks.json
        fi
        # Nothing staged here is served by the site. Workers Builds' watch paths should exclude reference/*.
        git commit -m "$REFRESH_COMMIT_MESSAGE" || echo "No changes to commit"
        git push
