name: Concall Summaries Refresh

on:
  # Started on time by the nexus-gh-cron Worker in new_nexys_ultimate (workers/gh-cron/schedule.ts), not a GitHub schedule.
  # The daily and weekly refreshes run the same step; this one picks up summaries between them, weekends included.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The daily and weekly refreshes read and rewrite the same concall index.
  group: daily-data-refresh
  cancel-in-progress: false

jobs:
  refresh-concalls:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
      R2_BUCKET: nexus-screener-chart-data

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'DO NOT DELETE EDL PIPELINE/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "DO NOT DELETE EDL PIPELINE/requirements.txt"

      - name: Install R2 uploader
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rclone

      - name: Pull published concall index from R2
        run: python frontend/site_data.py pull --only concalls/

      # Only calls not stored yet are fetched; see frontend/concall_history.py.
      - name: Refresh concall summaries
        timeout-minutes: 20
        run: python frontend/concall_history.py

      - name: Publish concall index to R2
        run: python frontend/site_data.py push-indexes --only concalls/

      - name: Upload Refresh Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: concall-diagnostics
          if-no-files-found: ignore
          path: frontend/concall-refresh-report.json
