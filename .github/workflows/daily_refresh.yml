name: Daily Data Refresh
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore scanner history
        uses: actions/cache/restore@v4
        with:
          path: |
            DO NOT DELETE EDL PIPELINE/ohlcv_data
            DO NOT DELETE EDL PIPELINE/indices_ohlcv_data
            DO NOT DELETE EDL PIPELINE/delivery_history_data
            DO NOT DELETE EDL PIPELINE/eod2_delivery_history_data
            DO NOT DELETE EDL PIPELINE/scanner_history_data
            DO NOT DELETE EDL PIPELINE/filing_history_data
            DO NOT DELETE EDL PIPELINE/ipo_provider_history_data
          key: scanner-history-v1-${{ runner.os }}-recovery-${{ github.run_id }}
          restore-keys: scanner-history-v1-${{ runner.os }}-
      - name: Confirm latest session
        run: tail -1 'DO NOT DELETE EDL PIPELINE/ohlcv_data/RELIANCE.csv'
      - name: Upload recovered history
        uses: actions/upload-artifact@v4
        with:
          name: recovered-scanner-history
          path: |
            DO NOT DELETE EDL PIPELINE/ohlcv_data
            DO NOT DELETE EDL PIPELINE/indices_ohlcv_data
            DO NOT DELETE EDL PIPELINE/delivery_history_data
            DO NOT DELETE EDL PIPELINE/eod2_delivery_history_data
            DO NOT DELETE EDL PIPELINE/scanner_history_data
            DO NOT DELETE EDL PIPELINE/filing_history_data
            DO NOT DELETE EDL PIPELINE/ipo_provider_history_data
          retention-days: 1
