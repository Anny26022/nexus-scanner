name: Daily Data Refresh

on:
  schedule:
    - cron: '30 10 * * 1-5' # Runs at 4:00 PM IST (10:30 UTC) Mon-Fri
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

concurrency:
  group: daily-data-refresh
  cancel-in-progress: false

jobs:
  refresh-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'DO NOT DELETE EDL PIPELINE/requirements.txt'

      - name: Restore refresh history
        uses: ./.github/actions/restore-refresh-history

      - name: Restore EOD2 data checkout
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/eod2_data
          key: eod2-data-v2-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            eod2-data-v2-${{ runner.os }}-
            eod2-data-v1-${{ runner.os }}-

      - name: Update EOD2 adjusted-history data
        id: eod2-update
        continue-on-error: true
        env:
          EOD2_DATA_DIR: ${{ runner.temp }}/eod2_data
        run: |
          previous=$(git -C "$EOD2_DATA_DIR" rev-parse HEAD 2>/dev/null || true)
          if [ -d "$EOD2_DATA_DIR/.git" ]; then
            git -C "$EOD2_DATA_DIR" pull --ff-only origin main
          else
            git clone --depth 1 https://github.com/BennyThadikaran/eod2_data.git "$EOD2_DATA_DIR"
          fi
          revision=$(git -C "$EOD2_DATA_DIR" rev-parse HEAD)
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          if [ "$previous" != "$revision" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save updated EOD2 data checkout
        if: steps.eod2-update.outcome == 'success' && steps.eod2-update.outputs.changed == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/eod2_data
          key: eod2-data-v2-${{ runner.os }}-${{ steps.eod2-update.outputs.revision }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "DO NOT DELETE EDL PIPELINE/requirements.txt"

      - name: Verify Pipeline Code
        run: |
          cd "DO NOT DELETE EDL PIPELINE"
          python -m unittest discover -s tests -v
          python -m compileall -q .

      - name: Verify scanner publication
        run: python -m unittest discover -s frontend -p 'test_*.py' -v

      - name: Install R2 uploader
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rclone

      # Carried-over pipeline files live in private R2 storage, not Git (tools/pipeline_state.py).
      - name: Pull pipeline state from R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
          R2_BUCKET: nexus-screener-chart-data
        run: python tools/pipeline_state.py pull

      - name: Fetch refresh inputs
        id: fetch
        env:
          PYTHONUNBUFFERED: '1'
          EDL_EOD2_DATA_DIR: ${{ runner.temp }}/eod2_data
        run: |
          cd "DO NOT DELETE EDL PIPELINE"
          python run_full_pipeline.py --phase fetch --stage "${{ runner.temp }}/edl-refresh-${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Save history after fetch
        if: always() && (steps.fetch.outcome == 'success' || steps.fetch.outcome == 'failure')
        continue-on-error: true
        uses: ./.github/actions/save-refresh-history
        with:
          phase: fetch

      - name: Build and publish validated data
        env:
          PYTHONUNBUFFERED: '1'
          EDL_EOD2_DATA_DIR: ${{ runner.temp }}/eod2_data
          EDL_CHART_STORAGE: r2
          EDL_FILING_BACKUPS: ${{ github.event_name == 'schedule' && '0' || '1' }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
          R2_BUCKET: nexus-screener-chart-data
        run: |
          cd "DO NOT DELETE EDL PIPELINE"
          python run_full_pipeline.py --phase build --stage "${{ runner.temp }}/edl-refresh-${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Save history after build
        if: always() && steps.fetch.outcome == 'success'
        continue-on-error: true
        uses: ./.github/actions/save-refresh-history
        with:
          phase: build

      - name: Refresh optional Earnings Pulse history
        continue-on-error: true
        timeout-minutes: 25
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
          R2_BUCKET: nexus-screener-chart-data
        run: python frontend/earningspulse_history.py

      - name: Fetch and publish Earnings Pulse Heatmap
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
          R2_BUCKET: nexus-screener-chart-data
        run: python frontend/earningspulse_heatmap.py

      # Only after a successful build; a failed push stops the run before anything is committed.
      - name: Push pipeline state to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
          R2_BUCKET: nexus-screener-chart-data
        run: python tools/pipeline_state.py push

      - name: Commit and Push Results
        uses: ./.github/actions/commit-refresh-outputs
        with:
          weekly: 'false'
          commit-message: 'Automated Daily Data Refresh'

      - name: Upload Refresh Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-diagnostics
          if-no-files-found: ignore
          path: |
            frontend/earningspulse-refresh-report.json
            DO NOT DELETE EDL PIPELINE/pipeline_report.json
            DO NOT DELETE EDL PIPELINE/pipeline_failure_report.json
            DO NOT DELETE EDL PIPELINE/price_validation_report.json
            DO NOT DELETE EDL PIPELINE/data_quality.json
            DO NOT DELETE EDL PIPELINE/data_quality_failure.json
