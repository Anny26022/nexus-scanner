name: US Backfill Historical Snapshots

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start Date for backfill (YYYY-MM-DD)'
        required: true
        default: '2021-10-01'
      end_date:
        description: 'End Date for backfill (YYYY-MM-DD)'
        required: true
        default: '2021-10-15'
      upload_r2:
        description: 'Upload generated snapshots to Cloudflare R2'
        type: boolean
        required: true
        default: true

permissions:
  contents: read

# Shared with the US daily refresh on purpose: both pull us/sessions.json from R2, add sessions and push the whole
# file back (frontend/publish_us.py archive_us_session), so running side by side would drop one run's sessions.
# Waiting runs queue in order (queue: max below), so several backfills can wait their turn behind a daily run.
concurrency:
  group: us-daily-refresh
  # queue: max keeps up to 100 waiting runs, not one: the default cancels an older waiting run when a newer one arrives,
  # and the nexus-gh-cron Worker never retries a scheduled run it finds cancelled.
  queue: max
  cancel-in-progress: false

jobs:
  backfill-us:
    name: Generate US Historical Snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Locate the US root
        run: echo "US_ROOT=${{ runner.temp }}/us-root" >> "$GITHUB_ENV"

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'DO NOT DELETE EDL PIPELINE/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "DO NOT DELETE EDL PIPELINE/requirements.txt"
          pip install boto3

      - name: Install R2 client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rclone

      # The daily run's state (price history, ledgers), from private R2 (tools/us_state.py). Read only: the backfill
      # never pushes it back.
      - name: Pull US state from R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
          R2_BUCKET: nexus-screener-chart-data
        run: python tools/us_state.py pull

      # Reported earnings dates (earningsDate, daysSinceEarnings, gap_up_earnings) come from the daily run's ledger.
      - name: Warn when earnings dates are unavailable
        run: |
          [ -f "$US_ROOT/quarterly_financial_history.json.gz" ] || echo "::warning::No US quarterly ledger in R2 yet (run the US daily refresh); backfilled sessions will have no earnings dates."

      # The backfill extends the live sessions list, which lives in R2 (frontend/site_data.py).
      - name: Pull published site data from R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
          R2_BUCKET: nexus-screener-chart-data
        run: python frontend/site_data.py pull

      # The root holds only the stored price history: the generator fails on a cold cache (run the US daily
      # refresh first), reads names and classification from Dhan's list and the committed Finviz file, and leaves
      # statement figures, market cap and ownership unavailable (no point-in-time source); earnings dates come from
      # the restored quarterly ledger.
      - name: Generate US Historical Snapshots
        env:
          START_DATE: ${{ github.event.inputs.start_date }}
          END_DATE: ${{ github.event.inputs.end_date }}
        run: |
          if [[ ! "$START_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ || ! "$END_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::start_date and end_date must be YYYY-MM-DD"; exit 1
          fi
          if [[ "$START_DATE" > "$END_DATE" ]]; then
            echo "::error::start_date $START_DATE is after end_date $END_DATE"; exit 1
          fi
          python tools/generate_historical_snapshots_us.py \
            --pipeline-dir "${{ env.US_ROOT }}" \
            --start-date "$START_DATE" \
            --end-date "$END_DATE" \
            --output-dir "outputs/historical_snapshots/us" \
            --update-sessions-manifest "frontend/public/data/us/sessions.json"

      - name: Upload to Cloudflare R2
        if: ${{ github.event.inputs.upload_r2 == 'true' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: nexus-screener-chart-data
        # Shared with the other market's backfill (tools/upload_snapshots.py).
        run: python tools/upload_snapshots.py outputs/historical_snapshots/us snapshots/us .upload_verified_us

      # Only once every snapshot it lists was uploaded and verified; the site reads it without a rebuild.
      - name: Publish Updated US Sessions Manifest
        if: ${{ hashFiles('.upload_verified_us') != '' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
          R2_BUCKET: nexus-screener-chart-data
        run: python frontend/site_data.py push-us-sessions

      - name: Upload Artifacts Archive
        uses: actions/upload-artifact@v4
        with:
          name: us-historical-snapshots-${{ github.event.inputs.start_date }}-to-${{ github.event.inputs.end_date }}
          path: outputs/historical_snapshots/us/*.json.gz
          if-no-files-found: ignore
