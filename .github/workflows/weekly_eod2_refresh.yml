name: Weekly Adjusted OHLCV Refresh

on:
  schedule:
    # Sunday 09:00 IST. EOD2 publishes weekly, so this supplements—not
    # replaces—the weekday official-NSE refresh.
    - cron: '30 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Do not let the long-history overlay race the normal daily publication.
  group: daily-data-refresh
  cancel-in-progress: false

jobs:
  refresh-adjusted-history:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            DO NOT DELETE EDL PIPELINE/requirements.txt
            tools/requirements-tijori.txt

      - name: Restore pipeline history
        uses: actions/cache@v4
        with:
          path: |
            DO NOT DELETE EDL PIPELINE/ohlcv_data
            DO NOT DELETE EDL PIPELINE/indices_ohlcv_data
            DO NOT DELETE EDL PIPELINE/delivery_history_data
            DO NOT DELETE EDL PIPELINE/eod2_delivery_history_data
            DO NOT DELETE EDL PIPELINE/scanner_history_data
            DO NOT DELETE EDL PIPELINE/filing_history_data
            DO NOT DELETE EDL PIPELINE/ipo_provider_history_data
            DO NOT DELETE EDL PIPELINE/scanx_ipo_history_data
          key: scanner-history-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            scanner-history-v1-${{ runner.os }}-

      - name: Select weekly EOD2 cache key
        id: eod2-cache-key
        # Sunday belongs to the ISO week that is ending.  The EOD2 refresh is
        # the baseline for Monday through Friday, so key it to next Monday.
        run: echo "week=$(date -u -d tomorrow +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore EOD2 data checkout
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/eod2_data
          key: eod2-data-v1-${{ runner.os }}-${{ steps.eod2-cache-key.outputs.week }}
          restore-keys: |
            eod2-data-v1-${{ runner.os }}-

      - name: Update EOD2 adjusted-history data
        env:
          EOD2_DATA_DIR: ${{ runner.temp }}/eod2_data
        run: |
          if [ -d "$EOD2_DATA_DIR/.git" ]; then
            git -C "$EOD2_DATA_DIR" pull --ff-only origin main
          else
            git clone --depth 1 https://github.com/BennyThadikaran/eod2_data.git "$EOD2_DATA_DIR"
          fi

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "DO NOT DELETE EDL PIPELINE/requirements.txt"
          pip install -r tools/requirements-tijori.txt

      - name: Verify Pipeline Code
        run: |
          python -m unittest discover -s tools -p test_export_tijori_overviews.py
          cd "DO NOT DELETE EDL PIPELINE"
          python -m unittest discover -s tests -v
          python -m compileall -q .

      - name: Verify scanner publication
        run: python -m unittest discover -s frontend -p 'test_*.py' -v

      - name: Install R2 uploader
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rclone

      - name: Run Pipeline with adjusted-history bootstrap
        env:
          PYTHONUNBUFFERED: '1'
          EDL_EOD2_DATA_DIR: ${{ runner.temp }}/eod2_data
          EDL_CHART_STORAGE: r2
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
          R2_BUCKET: nexus-screener-chart-data
        run: |
          cd "DO NOT DELETE EDL PIPELINE"
          python run_full_pipeline.py

      - name: Refresh Tijori company overviews
        id: tijori_refresh
        continue-on-error: true
        timeout-minutes: 60
        run: |
          python3 tools/export_tijori_overviews.py \
            --output reference/tijori \
            --sitemap reference/tijori/sitemap.xml \
            --refresh --retry-unmapped

      - name: Record Tijori refresh failure
        continue-on-error: true
        if: ${{ always() && steps.tijori_refresh.outcome == 'failure' }}
        env:
          TIJORI_STEP_OUTCOME: ${{ steps.tijori_refresh.outcome }}
          TIJORI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "::warning::Tijori refresh failed or timed out; see uploaded exceptions.json. The public dataset may be stale."
          echo "### Tijori refresh failed" >> "$GITHUB_STEP_SUMMARY"
          echo "The public dataset may be stale. See the refresh step log and exceptions.json in weekly-eod2-diagnostics." >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PYTHON'
          from datetime import datetime, timezone
          import json
          import os
          from pathlib import Path

          path = Path('reference/tijori/exceptions.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          try:
              diagnostics = json.loads(path.read_text())
          except (OSError, ValueError):
              diagnostics = {}
          diagnostics['runFailure'] = {
              'stepOutcome': os.environ['TIJORI_STEP_OUTCOME'],
              'failedAt': datetime.now(timezone.utc).isoformat(),
              'runUrl': os.environ['TIJORI_RUN_URL'],
              'message': 'Tijori export failed or timed out; the public dataset may be stale. See the refresh step log.',
          }
          temporary = path.with_suffix('.tmp')
          temporary.write_text(json.dumps(diagnostics, indent=2) + '\n')
          temporary.replace(path)
          PYTHON

      - name: Commit and Push Results
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          # A refresh can run long enough for main to receive a merge.  Start
          # the generated-data commit from that latest tip rather than
          # rebasing binary artifacts after they have been committed.
          git fetch origin main
          # Mixed reset retains the generated working files while refreshing
          # the index too, so unrelated code merged during this run is kept.
          git reset --mixed origin/main
          git add "DO NOT DELETE EDL PIPELINE/all_stocks_fundamental_analysis.json.gz"
          git add "DO NOT DELETE EDL PIPELINE/sector_analytics.json.gz"
          git add "DO NOT DELETE EDL PIPELINE/market_breadth.json.gz"
          git add "DO NOT DELETE EDL PIPELINE/market_breadth_v2.json.gz"
          git add "DO NOT DELETE EDL PIPELINE/sector_breadth_v2.json.gz"
          git add "DO NOT DELETE EDL PIPELINE/market_breadth_contributions_v2.json.gz"
          git add "DO NOT DELETE EDL PIPELINE/breadth_universe_snapshot.json.gz"
          git add "DO NOT DELETE EDL PIPELINE/all_indices_history_v2.json.gz"
          git add "DO NOT DELETE EDL PIPELINE/all_indices_list.json"
          git add "DO NOT DELETE EDL PIPELINE/corporate_action_ledger.json.gz"
          git add "DO NOT DELETE EDL PIPELINE/nse_corporate_actions.json.gz"
          git add "DO NOT DELETE EDL PIPELINE/nse_corporate_action_adjustments.json.gz"
          git add "DO NOT DELETE EDL PIPELINE/data_quality.json"
          git add "DO NOT DELETE EDL PIPELINE/pipeline_report.json"
          git add "DO NOT DELETE EDL PIPELINE/nse_universe_reconciliation.json"
          git add "DO NOT DELETE EDL PIPELINE/mainboard_universe_report.json"
          git add "DO NOT DELETE EDL PIPELINE/sme_market_data.json.gz"
          git add "DO NOT DELETE EDL PIPELINE/nse_fno_ban.json.gz"
          git add "DO NOT DELETE EDL PIPELINE/earnings_calendar.json.gz"
          git add "DO NOT DELETE EDL PIPELINE/rs_rating_daily.json.gz"
          git add "DO NOT DELETE EDL PIPELINE/ipo_screener.json.gz"
          git add "DO NOT DELETE EDL PIPELINE/ipo_provider_listed_archive.json.gz"
          git add "DO NOT DELETE EDL PIPELINE/ipo_provider_details_archive.json.gz"
          git add "DO NOT DELETE EDL PIPELINE/scanx_ipo_listed_archive.json.gz"
          git add "DO NOT DELETE EDL PIPELINE/scanx_ipo_details_archive.json.gz"
          git add "DO NOT DELETE EDL PIPELINE/shareholding_history.json.gz"
          git add "DO NOT DELETE EDL PIPELINE/quarterly_financial_history.json.gz"
          git add reference/index-constituent-mappings.json.gz
          git add reference/index-constituent-mappings.manifest.json
          git add frontend/public/data/current.json frontend/public/data/revisions
          git add reference/tijori/tijori-overviews.json.gz reference/tijori/summary.json
          git add frontend/public/data/tijori/current.json frontend/public/data/tijori/revisions
          git commit -m "Automated weekly adjusted OHLCV refresh [skip ci]" || echo "No changes to commit"
          git push

      - name: Upload Refresh Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-eod2-diagnostics
          if-no-files-found: ignore
          path: |
            DO NOT DELETE EDL PIPELINE/eod2_ohlcv_import_report.json
            DO NOT DELETE EDL PIPELINE/pipeline_report.json
            DO NOT DELETE EDL PIPELINE/pipeline_failure_report.json
            DO NOT DELETE EDL PIPELINE/data_quality.json
            DO NOT DELETE EDL PIPELINE/data_quality_failure.json
            reference/tijori/summary.json
            reference/tijori/exceptions.json
