name: ETF Snapshot Only

# Manual: adds the ETF snapshot to the live release when a full refresh published stocks but not ETFs.
# One TradingView request and two R2 uploads; stocks, charts and history are untouched.
on:
  workflow_dispatch:

permissions:
  contents: read

# Same queue as the full refresh, so the two never publish current.json at once.
concurrency:
  group: daily-data-refresh
  cancel-in-progress: false

jobs:
  publish-etfs:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'DO NOT DELETE EDL PIPELINE/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "DO NOT DELETE EDL PIPELINE/requirements.txt"

      - name: Install R2 uploader
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rclone

      - name: Publish ETF snapshot into the live release
        env:
          PYTHONUNBUFFERED: '1'
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
          R2_BUCKET: nexus-screener-chart-data
        run: python frontend/publish_etfs.py
