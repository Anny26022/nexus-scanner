name: Earnings Pulse Refresh

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-data-refresh
  cancel-in-progress: false

jobs:
  earningspulse:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install collector dependencies
        run: |
          pip install requests
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone
      - name: Fetch historical and current earnings
        id: collect
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
          R2_BUCKET: nexus-screener-chart-data
        run: python frontend/earningspulse_history.py --recheck-oldest
      - name: Publish verified earnings index
        run: |
          if [ -f frontend/public/data/earningspulse/index.json ]; then
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git add frontend/public/data/earningspulse/index.json
            if ! git diff --cached --quiet; then
              git commit -m "data: refresh Earnings Pulse history"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
      - name: Save refresh report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: earningspulse-refresh-report
          path: frontend/earningspulse-refresh-report.json
      - name: Report incomplete collection
        if: steps.collect.outcome == 'failure'
        run: exit 1
